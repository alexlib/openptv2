name: Build Wheels

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['cp311', 'cp312', 'cp313']
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        with:
          output-dir: ./wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_SKIP: "musllinux*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BEFORE_BUILD_LINUX: pip install numpy>=2.0.0 cython>=3.0.0 setuptools wheel && python setup.py prepare
          CIBW_BEFORE_BUILD_WINDOWS: pip install numpy>=2.0.0 cython>=3.0.0 setuptools wheel && python setup.py prepare
          CIBW_BEFORE_BUILD_MACOS: pip install numpy>=2.0.0 cython>=3.0.0 setuptools wheel && python setup.py prepare
          CIBW_BUILD_FRONTEND: "pip"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux2014"
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: x86_64 arm64
      
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies (sdist)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy>=2.0.0 cython>=3.0.0 build setuptools wheel
      
      - name: Prepare source files
        run: |
          python setup.py prepare
      
      - name: Build source distribution
        run: |
          python -m build --sdist
      
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test_package:
    name: Test package
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist openptv2[test]

      - name: Run tests
        run: |
          python -m pytest bindings/tests/ algorithms/tests/ -v --tb=short

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist, test_package]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.build_sdist.result == 'success' &&
      needs.build_wheels.result == 'success' &&
      needs.test_package.result == 'success'
    permissions:
      id-token: write  # mandatory for OIDC trusted publishing
      attestations: write  # needed by pypa/gh-action-pypi-publish >= v1.12 for Sigstore attestations
      contents: read  # needed to read repo contents for attestation metadata
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
