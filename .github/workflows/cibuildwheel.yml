name: Build Wheels

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['cp311', 'cp312', 'cp313']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm derives the version from tags

      - name: Set up Python (host)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Version (setuptools-scm)
        shell: bash
        run: |
          python -m pip install "setuptools-scm>=8"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$(python -m setuptools_scm)" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: ./wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BEFORE_BUILD_LINUX: >
            python -m pip install --upgrade pip &&
            python -m pip install "numpy>=2.0,<3" "cython>=3.0.10,<4" "setuptools>=77" "packaging>=24.2" "wheel>=0.43" "setuptools-scm>=8" &&
            python setup.py prepare
          CIBW_BEFORE_BUILD_WINDOWS: >
            python -m pip install --upgrade pip &&
            python -m pip install "numpy>=2.0,<3" "cython>=3.0.10,<4" "setuptools>=77" "packaging>=24.2" "wheel>=0.43" "setuptools-scm>=8" &&
            python setup.py prepare
          # Homebrew's libomp bottle targets the runner's (newest) macOS, so
          # delocate rejects it for an 11.0 wheel. Use the universal,
          # low-deployment-target (darwin20 = macOS 11) libomp from
          # mac.r-project.org instead — installs to /usr/local.
          CIBW_BEFORE_BUILD_MACOS: >
            curl -L -o /tmp/openmp.tar.gz https://mac.r-project.org/openmp/openmp-19.1.5-darwin20-Release.tar.gz &&
            sudo tar fxz /tmp/openmp.tar.gz -C / &&
            python -m pip install --upgrade pip &&
            python -m pip install "numpy>=2.0,<3" "cython>=3.0.10,<4" "setuptools>=77" "packaging>=24.2" "wheel>=0.43" "setuptools-scm>=8" &&
            python setup.py prepare
          CIBW_BUILD_FRONTEND: "pip"
          # the host-computed version, into the Linux build container too
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # 64-bit only. i686 is dropped: numpy/scipy ship no 32-bit wheels, so
          # the i686 test-install tries to build scipy from source and fails.
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          # Apple-Silicon-first: arm64 only. Intel Macs use the sdist.
          # (Add a macos-13 runner later if prebuilt x86_64 wheels are needed.)
          CIBW_ARCHS_MACOS: arm64
          # Point setup.py at the low-target libomp and match the wheel floor.
          CIBW_ENVIRONMENT_MACOS: "OPENPTV_LIBOMP_PREFIX=/usr/local MACOSX_DEPLOYMENT_TARGET=11.0"
          # Wheel smoke test: exercise the compiled core (incl. OpenMP tracking
          # kernels) with dependency-light tests. numpy/scipy/pyyaml ship as
          # wheel deps; the full suite's GUI-optional deps (imageio, skimage,
          # tqdm, ...) are intentionally out of scope for wheel CI.
          CIBW_TEST_REQUIRES: "pytest"
          # Import the OpenMP tracking kernels (validates libomp linkage — this
          # is where the macOS wheel failed at load), then run dependency-light
          # compiled-core tests. test_track/test_track3d are excluded: they
          # chdir + copytree dataset res_orig fixtures (not all tracked) and are
          # regression tests unsuited to wheel smoke.
          CIBW_TEST_COMMAND: >
            python {project}/scripts/ci_test_setup.py {project} &&
            python -c "import openptv2.algorithms.track_kernels_corr, openptv2.algorithms.track3d; print('openmp import OK')" &&
            pytest
            tests/unit/test_vec_utils.py
            tests/unit/test_correspondences.py
            tests/unit/test_orientation.py
            tests/unit/test_lsqadj.py
            tests/unit/test_imgcoord.py
            tests/unit/test_trafo.py
            tests/unit/test_epi.py
            tests/unit/test_multimed.py
            tests/unit/test_sortgrid.py
            -v -m "not slow" --tb=short

      
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python (host)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies (sdist)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "cython>=3.0.10,<4" "setuptools>=77" "packaging>=24.2" "setuptools-scm>=8" build wheel

      # Before `prepare` touches the tree: a dirty tree would change the version.
      # A tag must build exactly its version; a manual run a .devN one.
      - name: Version (setuptools-scm)
        run: |
          VERSION=$(python -m setuptools_scm)
          echo "Version: $VERSION"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "push" ]; then
            [ "$VERSION" = "${GITHUB_REF_NAME#v}" ] || { echo "tag $GITHUB_REF_NAME builds $VERSION"; exit 1; }
          else
            case "$VERSION" in *.dev*) ;; *) echo "$VERSION is not a dev version"; exit 1 ;; esac
          fi
      
      - name: Prepare source files
        run: |
          python setup.py prepare
      
      - name: Build source distribution
        run: |
          python -m build --sdist
      
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  test_package:
    name: Test package
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: "false"  # Skip for now - tests not included in wheel
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist openptv2[test]

      - name: Run tests
        run: |
          python -m pytest tests/unit/ -v --tb=short

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # tags -> stable release; "Run workflow" (workflow_dispatch) -> a
    # development release X.Y.(Z+1).devN of the chosen branch
    if: |
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch') &&
      needs.build_sdist.result == 'success' &&
      needs.build_wheels.result == 'success'
    # Matches the PyPI trusted-publisher "Environment name". Add required
    # reviewers to this environment in repo Settings to gate releases.
    environment:
      name: pypi
      url: https://pypi.org/p/openptv2
    permissions:
      id-token: write  # mandatory for OIDC trusted publishing
      attestations: write  # needed by pypa/gh-action-pypi-publish >= v1.12 for Sigstore attestations
      contents: read  # needed to read repo contents for attestation metadata
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  upload_release_assets:
    name: Upload wheels to GitHub Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.build_sdist.result == 'success' &&
      needs.build_wheels.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      
      - name: Upload wheels to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          fail_on_unmatched_files: false
      
      - name: Upload sdist to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: false
