name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Run CI-gate tests (marker: ci)
        # Minimal correctness gate -- see docs/plans/2026-08-26-zarr-only-v0.5.6-plan.md
        # (Phase 3c). The full suite runs locally / nightly via
        # scripts/run_regression_tests.py, not on every push.
        run: uv run pytest -m ci --tb=short -q
        env:
          # Headless linux runners have no display; without this every
          # tests/gui import dies at collection ("No pyface.toolkits
          # plugin could be loaded for qt").
          QT_QPA_PLATFORM: offscreen

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Ruff check
        run: uvx ruff check .
