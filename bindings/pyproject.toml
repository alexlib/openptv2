[build-system]
requires = [ "setuptools>=61.0.0", "wheel", "cython>=3.0.0", "numpy>=2.0.0" ]
build-backend = "setuptools.build_meta"

[project]
name = "optv"
dynamic = ["version"]
description = "OpenPTV Python bindings (Cython)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "LGPL-3.0-or-later"}
authors = [
    {name = "OpenPTV Community", email = "openptv@googlegroups.com"}
]
dependencies = [
    "numpy>=2.0.0",
]

[tool.setuptools]
packages = ["optv"]
package-dir = {"optv" = "optv"}

[tool.setuptools.dynamic]
version = {attr = "optv.version.__version__"}
