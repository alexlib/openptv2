[build-system]
requires = [
    "scikit-build-core>=0.9.0",
    "cython>=3.0.0",
    "numpy>=2.0.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "optv"
version = "1.0.0"
description = "OpenPTV Python bindings (Cython)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LGPL-3.0-or-later"}
authors = [
    {name = "OpenPTV Community", email = "openptv@googlegroups.com"}
]
dependencies = [
    "numpy>=2.0.0",
]

[tool.scikit-build]
# Build configuration
cmake.version = ">=3.15"
wheel.packages = ["optv"]

# CMake settings - use parent directory
cmake.source-dir = ".."
cmake.build-type = "Release"

# Install paths
install.components = ["python_bindings"]

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = "OFF"
BUILD_PYTHON_BINDINGS = "ON"
