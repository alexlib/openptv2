[build-system]
requires = [
    "setuptools>=61.0",
    "cython>=3.0.0,<4",
    "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "openptv2"
version = "0.4.0"
description = "OpenPTV2 single-engine particle tracking with Cython 3 pure Python modules"
readme = "README.md"
license = "MIT"
authors = [
    {name = "OpenPTV Community", email = "openptv@googlegroups.com"}
]
# Core + batch run on 3.11–3.14 (incl. free-threaded 3.14t; see Dockerfile.cloud).
# The [gui] stack (enable/chaco) currently has wheels only through 3.13.
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Default install (`pip install openptv2`) = the headless batch runtime: the
# minimum to `import openptv2`, run the algorithms/API, and the openptv2-batch
# sequence + tracking pipeline. `cython` is required by the interpreted
# fallback of the algorithms/ modules (they `import cython`); `scikit-image`
# is pulled in by the batch pipeline. No Traits/Qt/chaco here.
dependencies = [
    "cython>=3.0.0,<4",
    "h5py>=3.8.0",
    "imageio>=2.19.0",
    "numpy>=2.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "scikit-image>=0.20.0",
    "scipy>=1.10.0",
    "zarr>=2.16.0",
]

[project.optional-dependencies]
# End-user desktop GUI (openptv2-gui): the TraitsUI/Chaco/Enable stack on top
# of the default runtime. `enable` also provides `kiva`; `PySide6` is the Qt
# backend pyface binds to. (rembg is intentionally NOT here — see the
# `rembg` extra below — it is only used by the optional
# openptv2.plugins.rembg_* plugins.)
gui = [
    "traits>=6.4.0",
    "traitsui>=7.4.0",
    "enable>=6.1.0",
    "chaco>=6.1.0",
    "PySide6>=6.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "flowtracks>=0.3.0",
    "imagecodecs>=2023.1.23",
]
# Background-removal preprocessing (openptv2.plugins.rembg_sequence /
# rembg_contour_sequence). Not a core dependency: pulls in onnxruntime and
# downloads a model on first use.
rembg = [
    "rembg>=2.0.0",
]
# Interactive calibration/camera-pose visualization (src/openptv2/gui/*_nb.py
# marimo notebooks). Deliberately separate from [gui]: no Qt/chaco/traitsui,
# just marimo + matplotlib (numpy is already a core dependency).
viz = [
    "marimo>=0.19.10",
    "matplotlib>=3.7.0",
    "wigglystuff>=0.5.22",
]
# Everything a contributor needs: the full GUI, test/lint/type tooling, the
# marimo notebooks, and the docs toolchain.
dev = [
    "openptv2[gui]",
    "openptv2[viz]",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "ruff>=0.5.0",
    "setuptools>=61.0",              # build the Cython extensions in-place
    "optv>=0.3.2",                   # legacy C bindings for parity tests
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.0.0",
    "pydata-sphinx-theme>=0.16.0",
    "myst-parser>=5.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "pymdown-extensions>=10.0",
]

[project.scripts]
openptv = "openptv2.cli:main"
openptv2-gui = "openptv2.gui.pyptv_gui:main"
openptv2-batch = "openptv2.batch.pyptv_batch:main_cli"
openptv2-validate = "openptv2.validate:main"
pyptv = "openptv2.gui.pyptv_gui:main"
pyptv_gui = "openptv2.gui.pyptv_gui:main"
pyptv_batch = "openptv2.batch.pyptv_batch:main_cli"

[tool.setuptools]
packages = [
    "openptv2",
    "openptv2.algorithms",
    "openptv2.gui",
    "openptv2.batch",
    "openptv2.plugins",
]
include-package-data = true
zip-safe = false

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src", "."]
# Slow tests (full batch/tracking pipelines) are deselected by default.
# Run them with: uv run pytest -m slow   (or -m "slow or not slow" for all)
addopts = "-v --tb=short --import-mode=importlib -m 'not slow'"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:.*oneOf.*:DeprecationWarning",
    "ignore:.*setParseAction.*:DeprecationWarning",
    "ignore:.*delimitedList.*:DeprecationWarning",
    "ignore:.*setName.*:DeprecationWarning",
    "ignore:.*leaveWhitespace.*:DeprecationWarning",
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks:DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests that require GUI",
    "unit: fast deterministic unit tests",
    "parity: compiled-vs-reference parity tests",
    "perf: performance and throughput tests",
    "integration: multi-module integration tests",
]

[tool.coverage.run]
branch = true
# Measure the actual source package. The previous value used bare names
# ("algorithms", "gui", "batch") which are NOT importable top-level modules
# (they live under openptv2.*), so coverage silently measured 0 source files
# and only reported coverage of the test files themselves.
source = ["src/openptv2"]
omit = [
    # Non-product code: marimo notebooks, demos, ad-hoc scripts.
    "*_nb.py",
    "*/batch/demo_*.py",
    "*/batch/logger_demo.py",
    "*/batch/run_tracking_parameter_optimization.py",
]
# NOTE: modules under openptv2/algorithms compile to .so via Cython and CANNOT
# be traced by coverage.py in a normal run (they report 0%). To measure them,
# rebuild with line tracing (OPENPTV_CYTHON_TRACE=1) and enable the
# "Cython.Coverage" plugin — see the coverage plan in docs/.

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = false

# tifffile uses 3.12+ `type` statements; don't parse its source under py3.11 mypy.
[[tool.mypy.overrides]]
module = "tifffile.*"
follow_imports = "skip"

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

# algorithms/ is a deliberate line-by-line translation of the C original: its
# long lines and C-mirroring names are the house style, and ruff's isort splits
# the `if cython.compiled:` conditional imports into one statement per symbol,
# which would also force a full Cython rebuild of the in-place extensions.
# notebooks/ are marimo files, where cells reference names defined in other
# cells -- ruff sees one flat module and reports false undefined-name errors.
extend-exclude = [
    "src/openptv2/algorithms",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
# E501: line length is not enforced anywhere in this codebase; leaving it on
# kept `ruff check` permanently red and therefore useless as a gate.
ignore = ["D1", "E501"]

# src/ stays strict -- these carve-outs are for trees that are not shipped.
[tool.ruff.lint.per-file-ignores]
# F401: `import optv` / `import PySide6` inside a try/except is an availability
#       probe for skipping a test, not an unused import.
# E741: `l`, `I` mirror the matrix names in the C originals under test.
# E402: imports after a sys.path tweak or an importorskip guard.
"tests/**" = ["E402", "E741", "F401"]
"scripts/**" = ["E402"]
"skills/**" = ["E402", "F401"]
"docs/**" = ["E402"]
"test_data/**" = ["E402"]
"test_dictoffset.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "ruff>=0.5.0",
    "setuptools>=61.0",  # required to build the Cython extensions in-place
    "optv>=0.3.2",  # legacy C bindings for parity tests
]
