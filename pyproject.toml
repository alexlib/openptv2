[build-system]
requires = [
    "setuptools>=61.0",
    "cython>=3.0.0,<4",
    "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "openptv2"
version = "0.2.0"
description = "OpenPTV2 single-engine particle tracking with Cython 3 pure Python modules"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [
    {name = "OpenPTV Community", email = "openptv@googlegroups.com"}
]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "cython>=3.0.0,<4",
    "imageio>=2.19.0",
    "marimo>=0.23.0",
    "mkdocs>=1.6.1",
    "numpy>=2.0.0",
    "plotly>=6.7.0",
    "pytest>=9.0.2",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "traits>=7.1.0",
]

[project.optional-dependencies]
gui = [
    "traits>=6.4.0",
    "traitsui>=7.4.0",
    "enable>=6.1.0",
    "chaco>=6.1.0",
    "PySide6>=6.0.0",
    "scikit-image>=0.20.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tables>=3.8.0",
    "tqdm>=4.65.0",
    "imagecodecs>=2023.1.23",
    "flowtracks>=0.3.0",
    "Pygments>=2.15.0",
    "pyparsing>=3.0.0",
    "marimo>=0.19.10",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "optv>=0.3.2",  # legacy C bindings used by parity tests (skipped if absent)
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "ruff>=0.5.0",
    "traits>=6.4.0",
    "traitsui>=7.4.0",
    "enable>=6.1.0",
    "chaco>=6.1.0",
    "PySide6>=6.0.0",
    "scikit-image>=0.20.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tables>=3.8.0",
    "tqdm>=4.65.0",
    "imagecodecs>=2023.1.23",
    "flowtracks>=0.3.0",
    "Pygments>=2.15.0",
    "pyparsing>=3.0.0",
    "marimo>=0.19.10",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.0.0",
    "pydata-sphinx-theme>=0.16.0",
    "myst-parser>=5.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "pymdown-extensions>=10.0",
]

[project.scripts]
openptv = "openptv2.cli:main"
openptv2-gui = "openptv2.gui.pyptv_gui:main"
openptv2-batch = "openptv2.batch.pyptv_batch:main_cli"
openptv2-validate = "openptv2.validate:main"
pyptv = "openptv2.gui.pyptv_gui:main"
pyptv_gui = "openptv2.gui.pyptv_gui:main"
pyptv_batch = "openptv2.batch.pyptv_batch:main_cli"

[tool.setuptools]
packages = [
    "openptv2",
    "openptv2.algorithms",
    "openptv2.gui",
    "openptv2.gui.plugins",
    "openptv2.batch",
]
include-package-data = true
zip-safe = false

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
# Slow tests (full batch/tracking pipelines) are deselected by default.
# Run them with: uv run pytest -m slow   (or -m "slow or not slow" for all)
addopts = "-v --tb=short --import-mode=importlib -m 'not slow'"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:.*oneOf.*:DeprecationWarning",
    "ignore:.*setParseAction.*:DeprecationWarning",
    "ignore:.*delimitedList.*:DeprecationWarning",
    "ignore:.*setName.*:DeprecationWarning",
    "ignore:.*leaveWhitespace.*:DeprecationWarning",
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks:DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests that require GUI",
    "unit: fast deterministic unit tests",
    "parity: compiled-vs-reference parity tests",
    "perf: performance and throughput tests",
    "integration: multi-module integration tests",
]

[tool.coverage.run]
branch = true
# Measure the actual source package. The previous value used bare names
# ("algorithms", "gui", "batch") which are NOT importable top-level modules
# (they live under openptv2.*), so coverage silently measured 0 source files
# and only reported coverage of the test files themselves.
source = ["src/openptv2"]
omit = [
    # Non-product code: marimo notebooks, demos, ad-hoc scripts.
    "*_nb.py",
    "*/batch/demo_*.py",
    "*/batch/logger_demo.py",
    "*/batch/run_tracking_parameter_optimization.py",
]
# NOTE: modules under openptv2/algorithms compile to .so via Cython and CANNOT
# be traced by coverage.py in a normal run (they report 0%). To measure them,
# rebuild with line tracing (OPENPTV_CYTHON_TRACE=1) and enable the
# "Cython.Coverage" plugin — see the coverage plan in docs/.

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = false

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["D1"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "ruff>=0.5.0",
    "setuptools>=61.0",  # required to build the Cython extensions in-place
    "optv>=0.3.2",  # legacy C bindings for parity tests
]
