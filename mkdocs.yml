site_name: OpenPTV2 Documentation
site_description: Unified Particle Tracking Velocimetry with dual-engine support (C/Cython and pure Python/Numba).
site_author: OpenPTV Community
repo_name: alexlib/openptv2
repo_url: https://github.com/alexlib/openptv2

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation & Setup: installation.md
  - First Steps: first_steps.md
  - Tutorials:
    - End-to-End Tracking Tutorial: tutorials/getting_started_tutorial.md
    - Command-Line Batch Processing: tutorials/batch_processing.md
    - Tracking Visualization: tutorials/tracking_visualization.md
    - Debug Visualization: tutorials/tracking_debug_visualization.md
  - Running Tests: tests.md
  - Developer Guide:
    - Building from Source: developer_guide/building.md
    - Cython & Pure Python Modes: developer_guide/cython_and_pure_python.md
    - Free-Threaded Python (no-GIL): developer_guide/free_threading.md
    - Documentation Workflow: developer_guide/documentation_workflow.md
    - Packaging & Releases: developer_guide/packaging_and_releases.md
    - GUI Testing Guide: HOW_TO_TEST_GUI.md
  - Algorithms:
    - Tracking Core: algorithms/tracking.md
    - Burgers Gap Relinking Case Study: algorithms/burgers_gap_relinking_case_study.md
